[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-slop"
version = "0.8.0"
description = "Catch and prevent AI coding shortcuts and compounding software slop with automated checks, plain-English reviews, a verified learning loop, and real code-quality tests."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Jarel Remick" },
]
keywords = [
  "ai-agents",
  "claude-code",
  "codex",
  "antigravity",
  "code-quality",
  "static-analysis",
  "pre-commit",
  "github-actions",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jremick/anti-slop"
Repository = "https://github.com/jremick/anti-slop"
Issues = "https://github.com/jremick/anti-slop/issues"
Changelog = "https://github.com/jremick/anti-slop/blob/main/CHANGELOG.md"

[project.scripts]
anti-slop = "gates.cli:main"
anti-slop-diff = "gates.diff_check:main"
anti-slop-review = "gates.review:main"
anti-slop-audit = "gates.audit:main"
anti-slop-learn = "gates.learn:main"
anti-slop-hook = "gates.hooks.run_diff_gate_hook:main"
anti-slop-api = "gates.api_checks:main"
anti-slop-mutate = "gates.mutate:main"
anti-slop-verify = "gates.verify:main"

[tool.setuptools]
packages = ["gates", "gates.hooks", "library", "skills"]

[tool.setuptools.package-data]
gates = ["model_deltas.json"]
"gates.hooks" = ["*.example.json", "*.example.md"]
library = ["catalog.json"]
skills = ["anti-slop/SKILL.md", "README.md"]
