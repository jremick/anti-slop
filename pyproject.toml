[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-slop"
version = "0.6.0"
description = "Zero-dependency deterministic diff gates, agent lifecycle hooks, and model API/harness config validators for AI-assisted engineering."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Jarel Remick" },
]
keywords = [
  "ai-agents",
  "claude-code",
  "codex",
  "antigravity",
  "code-quality",
  "static-analysis",
  "pre-commit",
  "github-actions",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jremick/anti-slop"
Repository = "https://github.com/jremick/anti-slop"
Issues = "https://github.com/jremick/anti-slop/issues"
Changelog = "https://github.com/jremick/anti-slop/blob/main/CHANGELOG.md"

[project.scripts]
anti-slop-diff = "gates.diff_check:main"
anti-slop-hook = "gates.hooks.run_diff_gate_hook:main"
anti-slop-api = "gates.api_checks:main"

[tool.setuptools]
packages = ["gates", "gates.hooks"]

[tool.setuptools.package-data]
gates = ["model_deltas.json"]
"gates.hooks" = ["*.example.json", "*.example.md"]
