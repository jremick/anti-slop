# Warning-first deterministic prose configuration (Cursor unslop subset).
# Run diff-scoped in CI with `fail_on_error: true` (and MinAlertLevel = warning below)
# to block only objective error-level defects while surfacing stylistic rules as
# non-blocking warnings until calibrated.

StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = AntiSlop
# AntiSlop.Openers and AntiSlop.Closers block at `level: error`; Vocab and Phrasing default to `warning`.
# Scope ADRStructure to ADR/RFC documents so general READMEs and guides stay clean.
AntiSlop.ADRStructure = NO

# Opt-in ADR/RFC decision-field check (warning by default; set to `error` once calibrated).
[docs/adr/*.md]
AntiSlop.ADRStructure = warning

[docs/rfc/*.md]
AntiSlop.ADRStructure = warning

[*ADR*.md]
AntiSlop.ADRStructure = warning

[*RFC*.md]
AntiSlop.ADRStructure = warning
