<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" role="img" aria-labelledby="title desc">
  <title id="title">Multi-Turn Code Quality: EV1 (4-Turn Evolution)</title>
  <desc id="desc">pilot-evolution-v0.7.0 · 36 runs · 144 stages · 4 models × 3 conditions × n = 3 · 0 word caps. Overall acceptance moves from 50.0% (6/12, 75 slop) baseline to 41.7% (5/12, 45 slop) core-rules to 91.7% (11/12, 0 slop) gated-structural; mean AST mutation kill rate rises to 74.7%.</desc>
